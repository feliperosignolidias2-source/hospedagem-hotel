<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mensagem-sucesso {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #00c8ff;
            color: #001f3d;
            text-align: center;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="mensagem-sucesso" id="mensagem">✅ Cadastro salvo com sucesso!</div>

    <div class="formulario">
        <h1>Ficha de hospedagem</h1>

        <div class="campo">
            <label>Nome completo:</label>
            <input type="text" id="nome">
        </div>

        <div class="campo">
            <label>Endereço:</label>
            <input type="text" id="endereco">
        </div>

        <div class="campo">
            <label>Número:</label>
            <input type="text" id="numero">
        </div>

        <div class="campo">
            <label>Complemento:</label>
            <input type="text" id="complemento">
        </div>

        <div class="campo">
            <label>Bairro:</label>
            <input type="text" id="bairro">
        </div>

        <div class="campo">
            <label>Cidade:</label>
            <input type="text" id="cidade">
        </div>

        <div class="campo">
            <label>Estado:</label>
            <input type="text" id="estado">
        </div>

        <div class="campo">
            <label>Cep:</label>
            <input type="text" id="cep">
        </div>

        <div class="campo">
            <label>E-mail:</label>
            <input type="text" id="email">
        </div>

        <div class="campo">
            <label>Tel. Particular:</label>
            <input type="text" id="telParticular">
        </div>

        <div class="campo">
            <label>Tel. Empresa:</label>
            <input type="text" id="telEmpresa">
        </div>

        <div class="campo">
            <label>Tel. Fixo:</label>
            <input type="text" id="telFixo">
        </div>

        <div class="campo">
            <label>CPF:</label>
            <input type="text" id="cpf">
        </div>

        <div class="campo">
            <label>CNPJ:</label>
            <input type="text" id="cnpj">
        </div>

        <div class="campo">
            <label>Data de entrada:</label>
            <input type="date" id="entrada">
        </div>

        <div class="campo">
            <label>Data de saída:</label>
            <input type="date" id="saida">
        </div>

        <button type="button" class="btn-menu" onclick="salvarCadastro()">SALVAR CADASTRO</button>

    </div>

    <script>
        function salvarCadastro() {
            const nome = document.getElementById('nome').value;

            if (!nome) {
                alert('Por favor, preencha o nome do hóspede.');
                return;
            }

            const hospede = {
                nome,
                endereco:     document.getElementById('endereco').value,
                numero:       document.getElementById('numero').value,
                complemento:  document.getElementById('complemento').value,
                bairro:       document.getElementById('bairro').value,
                cidade:       document.getElementById('cidade').value,
                estado:       document.getElementById('estado').value,
                cep:          document.getElementById('cep').value,
                email:        document.getElementById('email').value,
                telParticular:document.getElementById('telParticular').value,
                telEmpresa:   document.getElementById('telEmpresa').value,
                telFixo:      document.getElementById('telFixo').value,
                cpf:          document.getElementById('cpf').value,
                cnpj:         document.getElementById('cnpj').value,
                entrada:      document.getElementById('entrada').value,
                saida:        document.getElementById('saida').value,
            };

            const lista = JSON.parse(localStorage.getItem('hospedes') || '[]');
            lista.push(hospede);
            localStorage.setItem('hospedes', JSON.stringify(lista));

            // Mostra mensagem de sucesso
            const mensagem = document.getElementById('mensagem');
            mensagem.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => { mensagem.style.display = 'none'; }, 4000);

            // Limpa os campos
            document.querySelectorAll('input').forEach(input => input.value = '');
        }
    </script>

</body>
</html>
